[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vqe_cudaq"
version = "1.0.0"
description = "Active-space VQE benchmarking of molecular ground-state energies on CUDA-Q (CPU/GPU)."
readme = "README.md"
requires-python = "==3.11.*"
license = { file = "LICENSE" }
authors = [{ name = "Khuram Shahzad" }, { name = "Rosa Di Felice" }]
keywords = ["VQE", "CUDA-Q", "quantum chemistry", "OpenFermion", "PySCF", "UCCSD"]

# Pinned to the published runs (conda environment "vqe_final"; complete list in
# environment/vqe_final_pip.txt). CUDA-Q (cudaq==0.11.0) is pinned in requirements.txt and
# environment/vqe_final_pip.txt; it is not listed here so that installing this package never
# replaces an existing CUDA-Q installation.
dependencies = [
    "numpy==1.26.4",
    "scipy==1.16.0",
    "pandas==2.3.3",
    "matplotlib==3.11.2",
    "pyscf==2.6.2",
    "openfermion==1.6.1",
    "openfermionpyscf==0.5",
]

[project.optional-dependencies]
# Interactive hover plots (analysis/scatter_interactive.py)
interactive = ["plotly"]
# Interactive molecular geometry visualization in Jupyter
visualization = ["ipython", "ipywidgets", "py3Dmol", "rdkit"]

[project.scripts]
vqe-cudaq = "vqe_cudaq.cli:main"

[tool.setuptools]
packages = ["vqe_cudaq", "analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end VQE runs (deselect with -m \"not slow\")"]
filterwarnings = ["ignore::DeprecationWarning"]
